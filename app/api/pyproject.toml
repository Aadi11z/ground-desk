[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.139.0",
    "google-genai>=2.10.0",
    "numpy>=2.5.1",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.15.0",
    "sentence-transformers>=5.6.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.5",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
