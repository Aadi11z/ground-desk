name: GroundDesk CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Run tests
        run: uv run --locked pytest -q
      - name: Formatting
        run: uv run --locked ruff format --check .
      - name: Docker build and import smoke test
        run: |
          docker build --tag grounddesk:ci .
          docker run --rm grounddesk:ci python -c "from app.main import app; assert app.title == 'GroundDesk'"
